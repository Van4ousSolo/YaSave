name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            ccache \
            autoconf \
            automake \
            libtool \
            libltdl-dev \
            pkg-config \
            cmake \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libsqlite3-dev \
            zip \
            unzip

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install "buildozer>=1.5.0" "cython<3.0" virtualenv

      # SDK / NDK / p4a builds: saves ~20+ minutes on repeat runs.
      # Full hit when buildozer.spec is unchanged; otherwise the latest cache is reused.
      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
            !.buildozer/android/platform/build-*/build/venv
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      # Permanent debug key: every build is signed the same way, so the app updates
      # on the phone without uninstalling. Without the secret Gradle creates a random key.
      - name: Restore debug keystore
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_B64" ]; then
            echo "::warning title=Debug keystore::Secret DEBUG_KEYSTORE_B64 is not set. The APK will be signed with a random key and will not install over the previous version."
            exit 0
          fi
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_B64" | base64 --decode > ~/.android/debug.keystore
          chmod 600 ~/.android/debug.keystore
          if command -v keytool >/dev/null 2>&1 && keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey >/dev/null 2>&1; then
            echo "Debug keystore restored (alias androiddebugkey)."
          else
            echo "::warning title=Debug keystore::Keystore restored, but alias 'androiddebugkey' with password 'android' was not found. Gradle may fail to sign the APK."
          fi

      # p4a's helper venv for pip-only requirements must never come from the cache:
      # a restored copy ends up with a half-upgraded pip (ImportError on startup).
      - name: Drop stale p4a pip venv
        run: rm -rf .buildozer/android/platform/build-*/build/venv

      # Manifest-only .aar that declares the media playback service (see buildozer.spec)
      - name: Build media AAR
        run: python tools/make_media_aar.py

      - name: Build APK with Buildozer
        run: |
          buildozer -v android debug || { echo "=== BUILDOZER LOG DUMP ==="; tail -n 200 .buildozer/buildozer.log 2>/dev/null; exit 1; }

      # Fails the build if the APK misses the native player, its manifest entries or our assets
      - name: Verify APK contents
        run: |
          set -u
          APK=$(ls -t bin/*.apk | head -n1)
          OUT=apk-check; rm -rf "$OUT"; mkdir -p "$OUT"
          BT=$(ls -d ~/.buildozer/android/platform/android-sdk/build-tools/* | sort -V | tail -n1)
          echo "APK: $APK"; echo "build-tools: $BT"
          FAIL=0
          ok()  { echo "  OK   $1"; }
          bad() { echo "::error title=APK check::$1"; echo "  FAIL $1"; FAIL=1; }

          echo "== dex classes =="
          unzip -o -q "$APK" 'classes*.dex' -d "$OUT/dex"
          for d in "$OUT"/dex/classes*.dex; do "$BT/dexdump" "$d" 2>/dev/null | grep "Class descriptor" | sed "s/.*'\(.*\)'/\1/" ; done | sort -u > "$OUT/dex-classes.txt"
          echo "  $(wc -l < "$OUT/dex-classes.txt") classes"
          for c in Lorg/yasave/media/YaSavePlayer\; Lorg/yasave/media/YaSaveMediaService\; Lorg/kivy/android/PythonActivity\;; do
            grep -qxF "$c" "$OUT/dex-classes.txt" && ok "class $c" || bad "class $c is missing from classes*.dex"
          done

          echo "== manifest =="
          "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$APK" > "$OUT/AndroidManifest.txt"
          "$BT/aapt" dump badging "$APK" > "$OUT/badging.txt" 2>/dev/null || true
          grep -E "uses-permission|service|receiver|foregroundServiceType" "$OUT/AndroidManifest.txt" | sed 's/^ *//' | sort -u
          for p in POST_NOTIFICATIONS FOREGROUND_SERVICE FOREGROUND_SERVICE_MEDIA_PLAYBACK WAKE_LOCK; do
            grep -q "\"android.permission.$p\"" "$OUT/AndroidManifest.txt" && ok "permission $p" || bad "permission $p is not declared"
          done
          grep -q '"org.yasave.media.YaSaveMediaService"' "$OUT/AndroidManifest.txt" && ok "service YaSaveMediaService" || bad "service YaSaveMediaService is not declared"
          # foregroundServiceType attribute is an int flag; mediaPlayback = 0x2
          awk '/org.yasave.media.YaSaveMediaService/{f=1} f&&/foregroundServiceType/{print; exit}' "$OUT/AndroidManifest.txt" | tee "$OUT/fgs-type.txt" \
            | grep -qiE '=("?mediaPlayback"?|(\(type 0x[0-9a-f]+\))?0x0*2|2)([^0-9a-fx]|$)' \
            && ok "service type mediaPlayback" || bad "YaSaveMediaService has no foregroundServiceType=mediaPlayback"

          echo "== notification icons (res/drawable) =="
          "$BT/aapt2" dump resources "$APK" > "$OUT/resources.txt" 2>/dev/null || true
          for r in ic_ys_note ic_ys_prev ic_ys_play ic_ys_pause ic_ys_next ic_ys_close; do
            grep -q "drawable/$r" "$OUT/resources.txt" && ok "drawable/$r" || bad "drawable/$r is missing (android.add_resources)"
          done

          echo "== assets =="
          unzip -l "$APK" > "$OUT/apk-files.txt"
          grep -q " assets/_load.html$" "$OUT/apk-files.txt" && ok "assets/_load.html" || bad "android/_load.html is not packaged as assets/_load.html"
          grep -q " assets/_yasave_icon.png$" "$OUT/apk-files.txt" && ok "assets/_yasave_icon.png" || bad "icon asset _yasave_icon.png is missing"
          SPLASH=$(grep -oE "res/drawable[^ ]*/presplash\.[a-z]+" "$OUT/apk-files.txt" | head -n1 || true)
          if [ -z "$SPLASH" ]; then bad "presplash is missing"; else
            unzip -p "$APK" "$SPLASH" | sha256sum | cut -d' ' -f1 > "$OUT/splash.sha"
            if [ "$(cat "$OUT/splash.sha")" = "$(sha256sum assets/presplash.png | cut -d' ' -f1)" ]; then ok "presplash = assets/presplash.png"
            else echo "::warning title=APK check::$SPLASH differs from assets/presplash.png (may be the default kivy splash)"; fi
          fi

          if [ "$FAIL" -ne 0 ]; then echo "APK check FAILED, see the apk-check artifact"; exit 1; fi
          echo "APK check passed"

      - name: Upload APK check details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: apk-check
          path: apk-check/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: YaSave-Debug-APK
          path: bin/*.apk
          retention-days: 14
